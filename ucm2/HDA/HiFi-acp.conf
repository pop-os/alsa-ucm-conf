# Workaround for panp16
If.panp16 {
    Condition {
        Type String
        Haystack "${sys:devices/virtual/dmi/id/sys_vendor} ${sys:devices/virtual/dmi/id/product_version}"
        Needle "System76 panp16"
	}
False.SectionDevice."Mic:acp" {
	Comment "Digital Microphone"

	Value {
		CapturePriority 100
		CapturePCM "hw:${var:AcpCardId}"
		CaptureMixerElem "Mic ACP LED"
		CaptureSwitch "Mic ACP LED Capture Switch"
	}
}
}
